paths:
  dataset_root: data/processed
  data_yaml: data/processed/data.yaml
  model_weights: runs/detect/sar_yolo11n/weights/best.pt
  exported_engine: runs/detect/sar_yolo11n/weights/best.engine
  results_dir: results
  input_source: 0

model:
  checkpoint: yolo11n.pt
  image_size: 640
  confidence: 0.35
  iou: 0.5
  device: 0
  classes: [person, fire, debris, water]
  train:
    epochs: 50
    batch: 8
    workers: 2
    patience: 15

stitching:
  interval_frames: 30
  min_frames: 2

serial:
  port: /dev/ttyTHS1
  baudrate: 115200
  timeout_seconds: 1.0
  max_packet_bytes: 512

pipeline:
  gps_origin: [0.0, 0.0]
  grid_resolution_m: 5.0
  waypoint_spacing_cells: 1
  send_every_n_frames: 1
